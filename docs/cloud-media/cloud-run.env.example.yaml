# Example only. Never commit a real project ID, service token, or signed URL.
# Cloud Run is intentionally disabled until the operator completes readiness gates.
CLOUD_MEDIA_RUN_ENABLED: "false"
WEB_APP_BASE_URL: "https://commerce-automation.vercel.app"
WORKER_JOB_TYPES: "video_render"
STORAGE_BACKEND: "r2"
R2_REGION: "auto"
R2_ENDPOINT_URL: "https://YOUR_R2_ACCOUNT_ID.r2.cloudflarestorage.com"
R2_MEDIA_BUCKET: "minz"
R2_REVIEW_URL_TTL_SECONDS: "900"
# Private bucket only. No r2.dev/custom public domain is required or enabled.
# WORKER_VISUAL_BINDING_SECRET is required from the existing server secret source.
# Exact HTTPS image asset origin(s); no wildcards and no redirecting CDNs.
CLOUD_MEDIA_IMAGE_HOSTS: "images.example.com"
# A real Linux-compatible, pre-approved Korean TTS command must be provided.
KOREAN_VOICE_PROVIDER: "disabled"
KOREAN_VOICE_PROVIDER_APPROVED: "false"
KOREAN_VOICE_LANGUAGE: "ko"
